name: xmobile
description: XMobile — sales force mobility app (Flutter client).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State and navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  collection: ^1.18.0

  # NOTE: deliberately no http client, database or location plugin yet.
  # The app runs against an in-memory ApiClient so every screen and form can be
  # exercised — and tested headlessly — before the backend exists. Swapping in the
  # real implementations is a change to one provider (see lib/core/api/api_client.dart).

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
