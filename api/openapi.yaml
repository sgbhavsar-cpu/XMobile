openapi: 3.1.0
info:
  title: XMobile API
  version: 1.0.0
  description: |
    Sales force mobility backend. On-premise ASP.NET Core + PostgreSQL/PostGIS.

    Conventions
    - All IDs are UUIDv7 generated by the client where the client creates the entity.
    - All timestamps are RFC 3339 with offset; the server stores UTC.
    - Every client-originated write carries an idempotency key
      (`clientMutationId`, or `Idempotency-Key` header on single-resource calls).
    - Every syncable resource exposes `rowVersion`; send it as `baseVersion` on update.
    - Errors use RFC 9457 `application/problem+json`.
servers:
  - url: https://xmobile.internal/api
    description: On-premise deployment

security:
  - oidc: []

tags:
  - name: Auth
  - name: Sync
  - name: Tracking
  - name: Tours
  - name: Visits
  - name: Reports
  - name: Expenses
  - name: Attachments
  - name: Customers
  - name: Opportunities
  - name: Manager
  - name: Admin
  - name: Integration

paths:
  # ------------------------------------------------------------------ Auth
  /v1/auth/device:
    post:
      tags: [Auth]
      summary: Register or refresh this device's binding
      description: Called after the first OIDC login. Binds the device to the user and returns sync policy.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceRegistration' }
      responses:
        '200':
          description: Registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceRegistrationResult' }
        '403': { $ref: '#/components/responses/Problem' }

  /v1/auth/me:
    get:
      tags: [Auth]
      summary: Current user profile, roles, home location, sync policy
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }

  /v1/auth/consent:
    post:
      tags: [Auth]
      summary: Record location-tracking consent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policyCode, policyVersion, granted]
              properties:
                policyCode: { type: string }
                policyVersion: { type: string }
                granted: { type: boolean }
      responses:
        '204': { description: Recorded }

  # ------------------------------------------------------------------ Sync
  /v1/sync/pull:
    get:
      tags: [Sync]
      summary: Delta pull of the rep's working set
      parameters:
        - { name: cursor,   in: query, schema: { type: string }, description: Opaque cursor; omit for first page }
        - { name: entities, in: query, schema: { type: string }, description: Comma-separated entity names; omit for all }
        - { name: limit,    in: query, schema: { type: integer, default: 500, maximum: 2000 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PullResponse' }

  /v1/sync/bootstrap:
    get:
      tags: [Sync]
      summary: Initial full working-set download (NDJSON, resumable)
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
      responses:
        '200':
          description: NDJSON stream of change envelopes
          content:
            application/x-ndjson:
              schema: { type: string }

  /v1/sync/push:
    post:
      tags: [Sync]
      summary: Push a batch of client mutations
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushRequest' }
      responses:
        '200':
          description: Per-mutation results (a 200 does not imply all applied)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushResponse' }

  /v1/sync/conflicts:
    get:
      tags: [Sync]
      summary: Unresolved sync conflicts for the current user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SyncConflict' }

  /v1/sync/conflicts/{id}/resolve:
    post:
      tags: [Sync]
      summary: Resolve a conflict by choosing a version
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [choice]
              properties:
                choice: { type: string, enum: [KEEP_SERVER, KEEP_CLIENT, MERGED] }
                mergedPayload: { type: object, additionalProperties: true }
      responses:
        '204': { description: Resolved }

  /v1/sync/health:
    get:
      tags: [Sync]
      summary: Server's view of this device's sync state
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncHealth' }

  # -------------------------------------------------------------- Tracking
  /v1/tracking/batch:
    post:
      tags: [Tracking]
      summary: Ingest location pings, geofence events, stays and heartbeat
      description: |
        Append-only and idempotent on `id`. Accepts events arbitrarily late; the server
        re-runs journey inference for the affected window.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrackingBatch' }
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackingBatchResult' }

  /v1/tracking/session:
    post:
      tags: [Tracking]
      summary: Start a tracking session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrackingSessionStart' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackingSession' }

  /v1/tracking/session/{id}/end:
    post:
      tags: [Tracking]
      summary: End a tracking session
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                endedAt: { type: string, format: date-time }
                reason: { type: string, enum: [SCHEDULE, TOUR_END, MANUAL, APP_KILLED, PERMISSION_LOST, TIMEOUT] }
      responses:
        '204': { description: Ended }

  /v1/tracking/session/{id}/pause:
    post:
      tags: [Tracking]
      summary: Pause tracking with a reason (auto-resumes after the configured cap)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pauseId, pausedAt, reasonCode]
              properties:
                pauseId: { type: string, format: uuid }
                pausedAt: { type: string, format: date-time }
                reasonCode: { type: string }
                reasonText: { type: string }
      responses:
        '204': { description: Paused }

  /v1/tracking/session/{id}/resume:
    post:
      tags: [Tracking]
      summary: Resume a paused session
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: Resumed }

  /v1/tracking/geofences:
    get:
      tags: [Tracking]
      summary: Geofence set this device should register
      description: |
        Returns at most `max` fences, ranked: home, next planned sites, then nearest sites
        to `lat`/`lon`, plus a re-arm fence whose exit triggers a recompute (iOS caps at 20).
      parameters:
        - { name: lat, in: query, schema: { type: number } }
        - { name: lon, in: query, schema: { type: number } }
        - { name: max, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Geofence' }

  /v1/tracking/journey:
    get:
      tags: [Tracking]
      summary: Journey timeline (events, segments, gaps) for a user and date range
      parameters:
        - { name: userId, in: query, schema: { type: string, format: uuid }, description: Defaults to caller; managers may query subordinates }
        - { name: from,   in: query, required: true, schema: { type: string, format: date } }
        - { name: to,     in: query, required: true, schema: { type: string, format: date } }
        - { name: includePath, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JourneyTimeline' }

  /v1/tracking/events/{id}/override:
    post:
      tags: [Tracking]
      summary: Correct a detected journey event (original is preserved)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [occurredAt, reason]
              properties:
                occurredAt: { type: string, format: date-time }
                reason: { type: string }
      responses:
        '200':
          description: Updated; triggers re-inference for the affected window
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JourneyEvent' }

  /v1/tracking/events/{id}/confirm:
    post:
      tags: [Tracking]
      summary: Confirm a low-confidence event held for review
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: Confirmed }

  /v1/tracking/heading-home:
    post:
      tags: [Tracking]
      summary: Rep declares the return leg has started (confidence 1.0 START_RETURN)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                occurredAt: { type: string, format: date-time }
                tourId: { type: string, format: uuid }
      responses:
        '204': { description: Recorded }

  # ----------------------------------------------------------------- Tours
  /v1/tours:
    get:
      tags: [Tours]
      summary: List tours
      parameters:
        - { name: from,   in: query, schema: { type: string, format: date } }
        - { name: to,     in: query, schema: { type: string, format: date } }
        - { name: status, in: query, schema: { type: string } }
        - { name: userId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Tour' } }
    post:
      tags: [Tours]
      summary: Create a tour with its day plan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TourUpsert' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tour' }

  /v1/tours/{id}:
    get:
      tags: [Tours]
      summary: Tour with days, visit plans and actuals
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TourDetail' }
    patch:
      tags: [Tours]
      summary: Update a tour (optimistic concurrency via baseVersion)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TourUpsert' }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Tour' } } } }
        '409': { $ref: '#/components/responses/Problem' }

  /v1/tours/{id}/start:
    post:
      tags: [Tours]
      summary: Mark the tour in progress and start tracking
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: Started }

  /v1/tours/{id}/complete:
    post:
      tags: [Tours]
      summary: Complete the tour (usually proposed automatically on ARRIVE_HOME)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: Completed }

  /v1/tours/{id}/days/{dayId}/plans:
    post:
      tags: [Tours]
      summary: Add a visit plan to a tour day
      parameters:
        - { name: id,    in: path, required: true, schema: { type: string, format: uuid } }
        - { name: dayId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VisitPlanUpsert' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/VisitPlan' } } } }

  /v1/tours/{id}/route-suggestion:
    get:
      tags: [Tours]
      summary: Suggested visit order for a tour day
      parameters:
        - { name: id,   in: path,  required: true, schema: { type: string, format: uuid } }
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RouteSuggestion' } } } }

  /v1/plans:
    get:
      tags: [Tours]
      summary: Visit plans for a date range (the rep's day list)
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to,   in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/VisitPlan' } } } } }

  /v1/plans/{id}/skip:
    post:
      tags: [Tours]
      summary: Skip a planned visit with a reason
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasonCode]
              properties:
                reasonCode: { type: string }
                remark: { type: string }
      responses:
        '204': { description: Skipped }

  # ---------------------------------------------------------------- Visits
  /v1/visits/check-in:
    post:
      tags: [Visits]
      summary: Check in to a customer site
      description: |
        Accepts an out-of-geofence check-in when `outOfFenceReasonCode` is supplied;
        the visit is flagged for manager review rather than refused.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckInRequest' }
      responses:
        '201': { description: Checked in, content: { application/json: { schema: { $ref: '#/components/schemas/Visit' } } } }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/visits/{id}/check-out:
    post:
      tags: [Visits]
      summary: Check out of a visit
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckOutRequest' }
      responses:
        '200': { description: Checked out, content: { application/json: { schema: { $ref: '#/components/schemas/Visit' } } } }

  /v1/visits:
    get:
      tags: [Visits]
      summary: List visits
      parameters:
        - { name: from,       in: query, schema: { type: string, format: date } }
        - { name: to,         in: query, schema: { type: string, format: date } }
        - { name: customerId, in: query, schema: { type: string, format: uuid } }
        - { name: userId,     in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Visit' } } } } }

  /v1/visits/{id}/report:
    get:
      tags: [Reports]
      summary: Get the visit report
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/VisitReport' } } } }
    put:
      tags: [Reports]
      summary: Save or submit the visit report
      description: Drafts are editable; a submitted report is immutable and changes go through /amend.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VisitReportUpsert' }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/VisitReport' } } } }
        '409': { $ref: '#/components/responses/Problem' }

  /v1/visits/{id}/report/amend:
    post:
      tags: [Reports]
      summary: Amend a submitted report (recorded as an amendment with a reason)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, report]
              properties:
                reason: { type: string }
                report: { $ref: '#/components/schemas/VisitReportUpsert' }
      responses:
        '200': { description: Amended, content: { application/json: { schema: { $ref: '#/components/schemas/VisitReport' } } } }

  /v1/form-templates:
    get:
      tags: [Reports]
      summary: Published form templates applicable to this user
      parameters:
        - { name: visitTypeCode, in: query, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/FormTemplate' } } } } }

  # -------------------------------------------------------------- Expenses
  /v1/expenses:
    get:
      tags: [Expenses]
      summary: List expenses
      parameters:
        - { name: from,   in: query, schema: { type: string, format: date } }
        - { name: to,     in: query, schema: { type: string, format: date } }
        - { name: tourId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Expense' } } } } }
    post:
      tags: [Expenses]
      summary: Capture an expense
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseUpsert' }
      responses:
        '201':
          description: Created; response includes duplicate candidates if any
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseCreateResult' }

  /v1/expenses/{id}:
    patch:
      tags: [Expenses]
      summary: Update an expense (rejected once pushed to XInfo)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseUpsert' }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Expense' } } } }
        '409': { $ref: '#/components/responses/Problem' }

  /v1/expenses/{id}/submit:
    post:
      tags: [Expenses]
      summary: Submit for push to XInfo
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: Submitted; queued in the outbox }

  /v1/expenses/mileage-suggestion:
    get:
      tags: [Expenses]
      summary: Mileage claim suggestion from tracked distance
      parameters:
        - { name: date,   in: query, required: true, schema: { type: string, format: date } }
        - { name: tourId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  distanceKm: { type: number }
                  distanceSource: { type: string, enum: [TRACKED, ESTIMATED] }
                  travelMode: { type: string }
                  ratePerKm: { type: number }
                  suggestedAmount: { type: number }
                  estimatedPortionKm: { type: number, description: Distance reconstructed across evidence gaps }

  /v1/expenses/share-inbox:
    get:
      tags: [Expenses]
      summary: Files shared into the app but not yet turned into expenses
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ShareInboxItem' } } } } }
    post:
      tags: [Expenses]
      summary: Register a shared file (UPI screenshot, ticket PDF) with OCR hints
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShareInboxUpsert' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ShareInboxItem' } } } }

  /v1/expenses/categories:
    get:
      tags: [Expenses]
      summary: Expense categories with capture rules
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ExpenseCategory' } } } } }

  # ----------------------------------------------------------- Attachments
  /v1/attachments:
    post:
      tags: [Attachments]
      summary: Register an attachment and obtain presigned upload URLs
      description: If `sha256` already exists for this user, returns `deduplicated:true` and no upload is required.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttachmentRegister' }
      responses:
        '201': { description: Registered, content: { application/json: { schema: { $ref: '#/components/schemas/AttachmentRegisterResult' } } } }

  /v1/attachments/{id}/complete:
    post:
      tags: [Attachments]
      summary: Finalise a multipart upload; server verifies sha256 and queues OCR
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                parts:
                  type: array
                  items:
                    type: object
                    properties:
                      partNumber: { type: integer }
                      etag: { type: string }
      responses:
        '200': { description: Completed, content: { application/json: { schema: { $ref: '#/components/schemas/Attachment' } } } }

  /v1/attachments/{id}/content:
    get:
      tags: [Attachments]
      summary: Redirect to a short-lived presigned download URL
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: thumbnail, in: query, schema: { type: boolean, default: false } }
      responses:
        '302': { description: Redirect to MinIO }

  # ------------------------------------------------------------- Customers
  /v1/customers:
    get:
      tags: [Customers]
      summary: Assigned customers
      parameters:
        - { name: q,      in: query, schema: { type: string } }
        - { name: nearLat, in: query, schema: { type: number } }
        - { name: nearLon, in: query, schema: { type: number } }
        - { name: radiusM, in: query, schema: { type: integer, default: 5000 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Customer' } } } } }

  /v1/customers/{id}/sites:
    get:
      tags: [Customers]
      summary: Sites of a customer
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CustomerSite' } } } } }
    post:
      tags: [Customers]
      summary: Add a site to an existing customer (no approval gate)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerSiteUpsert' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerSite' } } } }

  /v1/customers/{id}/history:
    get:
      tags: [Customers]
      summary: Sales/order history and past visits for a customer
      description: Sales history is a read-only rolling-window cache of XInfo data; visit history is XMobile's own.
      parameters:
        - { name: id,    in: path,  required: true, schema: { type: string, format: uuid } }
        - { name: since, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sales:  { type: array, items: { $ref: '#/components/schemas/SalesHistoryItem' } }
                  visits: { type: array, items: { $ref: '#/components/schemas/Visit' } }
                  salesAsOf: { type: string, format: date-time, description: Freshness of the cached sales data }

  /v1/customers/{id}/summary:
    get:
      tags: [Customers]
      summary: Customer 360 — what the rep sees before walking in
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Customer360' } } } }

  /v1/customers/propose:
    post:
      tags: [Customers]
      summary: Propose a new customer from the field
      description: |
        Creates a PROSPECT that is immediately visitable and pushes it to XInfo for approval.
        The local id never changes; XInfo's id is filled in on approval.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerProposal' }
      responses:
        '201': { description: Created as PROSPECT, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }

  /v1/customers/{id}/contacts:
    post:
      tags: [Customers]
      summary: Add a contact to an existing customer (no approval gate)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerContactUpsert' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerContact' } } } }

  # --------------------------------------------------------- Opportunities
  /v1/opportunities:
    get:
      tags: [Opportunities]
      summary: Opportunities visible to the caller
      parameters:
        - { name: customerId, in: query, schema: { type: string, format: uuid } }
        - { name: openOnly,   in: query, schema: { type: boolean, default: true } }
        - { name: userId,     in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Opportunity' } } } } }
    post:
      tags: [Opportunities]
      summary: Create an opportunity (may originate in the field, offline)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpportunityUpsert' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Opportunity' } } } }

  /v1/opportunities/{id}:
    patch:
      tags: [Opportunities]
      summary: Update rep-owned fields (stage, value, expected close date)
      description: |
        Only rep-owned fields are accepted; ownership and customer linkage belong to XInfo.
        A stage change writes stage history and, when supplied, links the visit that caused it.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpportunityUpdate' }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Opportunity' } } } }
        '409': { $ref: '#/components/responses/Problem' }

  /v1/opportunities/{id}/history:
    get:
      tags: [Opportunities]
      summary: Stage and value movement, with the visit that caused each change
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/OpportunityStageChange' } }

  /v1/visits/{id}/opportunities:
    put:
      tags: [Opportunities]
      summary: Link the visit to the opportunities it advanced
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required: [opportunityId]
                properties:
                  opportunityId: { type: string, format: uuid }
                  stageAfter:    { type: string }
                  valueAfter:    { type: number }
                  discussedNote: { type: string }
      responses:
        '200':
          description: Linked
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Opportunity' } }

  /v1/opportunity-stages:
    get:
      tags: [Opportunities]
      summary: Configured pipeline stages
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/OpportunityStage' } } } } }

  /v1/sites/{id}/capture-location:
    post:
      tags: [Customers]
      summary: Capture or correct a site's coordinates from the field
      description: Field capture supersedes geocoded coordinates and is pushed back to XInfo.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lon, accuracyM]
              properties:
                lat: { type: number }
                lon: { type: number }
                accuracyM: { type: number }
                geofenceRadiusM: { type: integer }
                capturedAt: { type: string, format: date-time }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerSite' } } } }

  # --------------------------------------------------------------- Manager
  /v1/manager/live:
    get:
      tags: [Manager]
      summary: Live status of the caller's team
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/LiveStatus' } } } } }

  /v1/manager/plan-vs-actual:
    get:
      tags: [Manager]
      summary: Plan adherence for the team over a date range
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to,   in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PlanVsActual' } } } } }

  /v1/manager/exceptions:
    get:
      tags: [Manager]
      summary: Exception feed (gaps, tamper flags, out-of-geofence check-ins, long pauses)
      parameters:
        - { name: from,     in: query, schema: { type: string, format: date } }
        - { name: to,       in: query, schema: { type: string, format: date } }
        - { name: severity, in: query, schema: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Exception' } } } } }

  /v1/manager/exceptions/{id}/acknowledge:
    post:
      tags: [Manager]
      summary: Acknowledge or resolve an exception
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
                resolve: { type: boolean, default: false }
      responses:
        '204': { description: Acknowledged }

  # ----------------------------------------------------------------- Admin
  /v1/admin/form-templates:
    post:
      tags: [Admin]
      summary: Create a draft form template version
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FormTemplateUpsert' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/FormTemplate' } } } }

  /v1/admin/form-templates/{id}/publish:
    post:
      tags: [Admin]
      summary: Publish a template version (immutable thereafter)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: Published }

  /v1/admin/settings:
    get:
      tags: [Admin]
      summary: Runtime settings (tracking thresholds, sync windows)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
    patch:
      tags: [Admin]
      summary: Update runtime settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '204': { description: Updated }

  /v1/admin/sync-policy:
    get:
      tags: [Admin]
      summary: Sync windows per role and entity
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SyncPolicy' } } } } }
    put:
      tags: [Admin]
      summary: Replace sync policy (bumps policyVersion; devices re-evaluate their working set)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: array, items: { $ref: '#/components/schemas/SyncPolicy' } }
      responses:
        '204': { description: Updated }

  /v1/admin/devices/{id}/revoke:
    post:
      tags: [Admin]
      summary: Revoke a device and optionally wipe its local data on next contact
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
                wipe:   { type: boolean, default: true }
      responses:
        '204': { description: Revoked }

  /v1/admin/sites/{id}/suggest-radius:
    post:
      tags: [Admin]
      summary: Suggest a geofence radius from historical check-in spread
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  currentRadiusM:   { type: integer }
                  suggestedRadiusM: { type: integer }
                  sampleSize:       { type: integer }

  # ----------------------------------------------------------- Integration
  /v1/integration/xinfo/webhook:
    post:
      tags: [Integration]
      summary: XInfo change notification (HMAC-signed)
      security: [{ hmac: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entity:    { type: string }
                ids:       { type: array, items: { type: string } }
                changedAt: { type: string, format: date-time }
      responses:
        '202': { description: Targeted pull queued }

  /v1/integration/outbox:
    get:
      tags: [Integration]
      summary: Outbox status (operations dashboard)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [PENDING, IN_FLIGHT, SENT, FAILED, DEAD] } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/OutboxMessage' } } } } }

  /v1/integration/outbox/{id}/retry:
    post:
      tags: [Integration]
      summary: Replay a failed or dead outbox message
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        '204': { description: Requeued }

  /v1/integration/reconciliation:
    get:
      tags: [Integration]
      summary: Nightly reconciliation results vs XInfo
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to,   in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ReconciliationRun' } } } } }

components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://keycloak.internal/realms/xmobile/.well-known/openid-configuration
    hmac:
      type: apiKey
      in: header
      name: X-XInfo-Signature

  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      properties:
        type:     { type: string }
        title:    { type: string }
        status:   { type: integer }
        detail:   { type: string }
        instance: { type: string }
        errors:   { type: object, additionalProperties: { type: array, items: { type: string } } }

    GeoPoint:
      type: object
      required: [lat, lon]
      properties:
        lat:       { type: number, minimum: -90,  maximum: 90 }
        lon:       { type: number, minimum: -180, maximum: 180 }
        accuracyM: { type: number }

    DeviceRegistration:
      type: object
      required: [deviceId, platform]
      properties:
        deviceId:     { type: string, format: uuid }
        platform:     { type: string, enum: [ANDROID, IOS] }
        model:        { type: string }
        manufacturer: { type: string }
        osVersion:    { type: string }
        appVersion:   { type: string }
        installId:    { type: string }
        pushToken:    { type: string }
        isCompanyOwned: { type: boolean }
        health:       { $ref: '#/components/schemas/TrackingHealth' }

    TrackingHealth:
      type: object
      description: Device conditions that determine whether tracking can actually work.
      properties:
        locationPermission:  { type: string, enum: [ALWAYS, WHEN_IN_USE, DENIED, UNKNOWN] }
        batteryOptimised:    { type: boolean, description: true means the OS may kill the tracking service }
        notificationsAllowed: { type: boolean }
        activityPermission:  { type: boolean }
        mockLocationAllowed: { type: boolean }
        isPowerSaving:       { type: boolean }
        score:               { type: integer, minimum: 0, maximum: 100 }
        issues:              { type: array, items: { type: string } }

    DeviceRegistrationResult:
      type: object
      properties:
        deviceId:      { type: string, format: uuid }
        syncPolicy:    { type: array, items: { $ref: '#/components/schemas/SyncPolicy' } }
        policyVersion: { type: integer }
        settings:      { type: object, additionalProperties: true }
        serverTime:    { type: string, format: date-time }

    Me:
      type: object
      properties:
        userId:       { type: string, format: uuid }
        employeeCode: { type: string }
        fullName:     { type: string }
        roles:        { type: array, items: { type: string } }
        managerId:    { type: string, format: uuid }
        orgUnit:      { type: object, additionalProperties: true }
        homeLocation: { $ref: '#/components/schemas/HomeLocation' }
        shiftStart:   { type: string, example: '09:00' }
        shiftEnd:     { type: string, example: '18:00' }
        workingDays:  { type: array, items: { type: integer } }
        consentRequired: { type: boolean }

    HomeLocation:
      type: object
      properties:
        id:              { type: string, format: uuid }
        label:           { type: string }
        point:           { $ref: '#/components/schemas/GeoPoint' }
        geofenceRadiusM: { type: integer }
        city:            { type: string }

    PullResponse:
      type: object
      properties:
        changes:
          type: array
          items:
            type: object
            properties:
              entity:     { type: string }
              id:         { type: string }
              op:         { type: string, enum: [UPSERT, DELETE, SCOPE_REMOVE] }
              rowVersion: { type: integer, format: int64 }
              updatedAt:  { type: string, format: date-time }
              data:       { type: object, additionalProperties: true }
        nextCursor:    { type: string }
        hasMore:       { type: boolean }
        serverTime:    { type: string, format: date-time }
        policyVersion: { type: integer }

    PushRequest:
      type: object
      required: [deviceId, mutations]
      properties:
        deviceId:   { type: string, format: uuid }
        deviceTime: { type: string, format: date-time }
        mutations:
          type: array
          maxItems: 500
          items:
            type: object
            required: [clientMutationId, entity, id, op]
            properties:
              clientMutationId: { type: string, format: uuid }
              entity:      { type: string }
              id:          { type: string, format: uuid }
              op:          { type: string, enum: [INSERT, UPDATE, DELETE] }
              baseVersion: { type: integer, format: int64, nullable: true }
              occurredAt:  { type: string, format: date-time }
              data:        { type: object, additionalProperties: true }

    PushResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              clientMutationId: { type: string, format: uuid }
              status:     { type: string, enum: [APPLIED, DUPLICATE, CONFLICT, REJECTED, DEFERRED] }
              rowVersion: { type: integer, format: int64 }
              reason:     { type: string }
              resolution: { type: string, enum: [SERVER_WINS, CLIENT_WINS, FIELD_MERGE, MANUAL_REQUIRED] }
              conflictId: { type: string, format: uuid }
              serverData: { type: object, additionalProperties: true }
              errors:     { type: array, items: { type: string } }
        serverTime: { type: string, format: date-time }

    SyncConflict:
      type: object
      properties:
        id:            { type: string, format: uuid }
        entity:        { type: string }
        entityId:      { type: string, format: uuid }
        reason:        { type: string }
        resolution:    { type: string }
        clientPayload: { type: object, additionalProperties: true }
        serverPayload: { type: object, additionalProperties: true }
        detectedAt:    { type: string, format: date-time }

    SyncHealth:
      type: object
      properties:
        deviceId:            { type: string, format: uuid }
        lastPullAt:          { type: string, format: date-time }
        lastPushAt:          { type: string, format: date-time }
        pendingConflicts:    { type: integer }
        oldestUnsyncedAgeSec: { type: integer }
        policyVersion:       { type: integer }

    SyncPolicy:
      type: object
      properties:
        roleCode:         { type: string, nullable: true }
        entity:           { type: string }
        backDays:         { type: integer }
        forwardDays:      { type: integer }
        attachmentsMode:  { type: string, enum: [ALWAYS, WIFI_ONLY, METADATA_ONLY, NEVER] }
        maxAttachmentMb:  { type: integer }
        refreshMinutes:   { type: integer }
        pullPageSize:     { type: integer }
        pushBatchSize:    { type: integer }

    TrackingBatch:
      type: object
      required: [deviceId]
      properties:
        deviceId:  { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        pings:     { type: array, items: { $ref: '#/components/schemas/Ping' }, maxItems: 1000 }
        events:    { type: array, items: { $ref: '#/components/schemas/GeofenceEvent' } }
        stays:     { type: array, items: { $ref: '#/components/schemas/StayDetection' } }
        heartbeat: { $ref: '#/components/schemas/Heartbeat' }

    Ping:
      type: object
      required: [id, recordedAt, lat, lon]
      properties:
        id:           { type: string, format: uuid }
        recordedAt:   { type: string, format: date-time }
        lat:          { type: number }
        lon:          { type: number }
        accuracyM:    { type: number }
        altitudeM:    { type: number }
        speedMps:     { type: number }
        headingDeg:   { type: number }
        activityType: { type: string, enum: [still, walking, running, on_bicycle, in_vehicle, unknown] }
        activityConfidence: { type: integer }
        isMoving:     { type: boolean }
        batteryPct:   { type: integer }
        isCharging:   { type: boolean }
        provider:     { type: string }
        isMock:       { type: boolean }
        source:       { type: string, enum: [FG_SERVICE, GEOFENCE, SIGNIFICANT_CHANGE, IOS_VISIT, MOTION, MANUAL, HEARTBEAT] }
        seq:          { type: integer, format: int64 }
        deviceTz:     { type: string }

    GeofenceEvent:
      type: object
      required: [id, geofenceId, eventType, occurredAt]
      properties:
        id:         { type: string, format: uuid }
        geofenceId: { type: string, format: uuid }
        eventType:  { type: string, enum: [ENTER, EXIT, DWELL] }
        occurredAt: { type: string, format: date-time }
        lat:        { type: number }
        lon:        { type: number }
        accuracyM:  { type: number }
        dwellSec:   { type: integer }

    StayDetection:
      type: object
      required: [id, arrivedAt, lat, lon, source]
      properties:
        id:         { type: string, format: uuid }
        arrivedAt:  { type: string, format: date-time }
        departedAt: { type: string, format: date-time }
        lat:        { type: number }
        lon:        { type: number }
        source:     { type: string, enum: [IOS_VISIT, ANDROID_STATIONARY, CLUSTER] }

    Heartbeat:
      type: object
      properties:
        reportedAt:      { type: string, format: date-time }
        batteryPct:      { type: integer }
        isPowerSaving:   { type: boolean }
        locationEnabled: { type: boolean }
        permissionLevel: { type: string }
        serviceRunning:  { type: boolean }
        queuedPings:     { type: integer }
        queuedMutations: { type: integer }
        networkType:     { type: string }

    TrackingBatchResult:
      type: object
      properties:
        acceptedPings:     { type: integer }
        acceptedEvents:    { type: integer }
        duplicates:        { type: integer }
        rejected:          { type: array, items: { type: object, additionalProperties: true } }
        nextUploadAfterSec: { type: integer, description: Server-side throttle hint }
        serverTime:        { type: string, format: date-time }

    TrackingSessionStart:
      type: object
      required: [sessionId, deviceId, startedAt, startReason]
      properties:
        sessionId:   { type: string, format: uuid }
        deviceId:    { type: string, format: uuid }
        tourId:      { type: string, format: uuid }
        startedAt:   { type: string, format: date-time }
        startReason: { type: string, enum: [SCHEDULE, TOUR_START, MANUAL, GEOFENCE, REBOOT] }

    TrackingSession:
      type: object
      properties:
        id:        { type: string, format: uuid }
        status:    { type: string, enum: [ACTIVE, PAUSED, ENDED] }
        startedAt: { type: string, format: date-time }
        endedAt:   { type: string, format: date-time }
        samplingProfile: { type: string, enum: [IDLE, DWELL, MOVING_LOCAL, TRANSIT] }

    Geofence:
      type: object
      properties:
        id:       { type: string, format: uuid }
        refType:  { type: string, enum: [HOME, CUSTOMER_SITE, REARM] }
        refId:    { type: string, format: uuid }
        name:     { type: string }
        lat:      { type: number }
        lon:      { type: number }
        radiusM:  { type: integer }
        dwellSec: { type: integer }
        priority: { type: integer, description: Lower is registered first when the platform limit bites }

    JourneyTimeline:
      type: object
      properties:
        userId:   { type: string, format: uuid }
        from:     { type: string, format: date }
        to:       { type: string, format: date }
        events:   { type: array, items: { $ref: '#/components/schemas/JourneyEvent' } }
        segments: { type: array, items: { $ref: '#/components/schemas/JourneySegment' } }
        anomalies: { type: array, items: { $ref: '#/components/schemas/Exception' } }
        daily:    { type: array, items: { $ref: '#/components/schemas/DailySummary' } }

    JourneyEvent:
      type: object
      properties:
        id:              { type: string, format: uuid }
        type:            { type: string, enum: [DEPART_HOME, ARRIVE_CUSTOMER, DEPART_CUSTOMER, START_RETURN,
                                                ARRIVE_HOME, OVERNIGHT_STOP_START, OVERNIGHT_STOP_END,
                                                TRANSIT_START, TRANSIT_END, PAUSE_START, PAUSE_END, GAP_START, GAP_END] }
        occurredAt:      { type: string, format: date-time }
        localDate:       { type: string, format: date }
        point:           { $ref: '#/components/schemas/GeoPoint' }
        refType:         { type: string }
        refId:           { type: string, format: uuid }
        siteName:        { type: string }
        detectionMethod: { type: string }
        confidence:      { type: number, minimum: 0, maximum: 1 }
        status:          { type: string, enum: [DETECTED, NEEDS_REVIEW, CONFIRMED, REJECTED, SUPERSEDED] }
        isEstimated:     { type: boolean }
        evidence:        { type: object, additionalProperties: true }
        originalOccurredAt: { type: string, format: date-time, nullable: true }

